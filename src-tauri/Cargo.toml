[package]
name = "legacykit"
version = "1.0.0"
description = "Cross-platform iOS device restore, downgrade, and jailbreak toolkit (Tauri + Svelte)."
authors = ["LegacyKit contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Drakeym132/LegacyKit"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Required for transparent webview/window behavior on macOS.
# Note: this uses private APIs and is not Mac App Store compatible.
tauri = { version = "2.11.0", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
window-vibrancy = "0.6"

# The `objc 0.2.x` crate is unmaintained and its `msg_send!` / `class!` /
# `sel!` macros expand to `#[cfg(feature = "cargo-clippy")]` checks that
# trigger the `unexpected_cfgs` lint added in modern rustc. Until we migrate
# off `objc 0.2`, allow the lint at the crate level. This affects only our
# own crate's lint reporting, not transitive dependencies.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
